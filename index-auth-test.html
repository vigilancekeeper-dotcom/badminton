"use strict";
/* EARLY NAVIGATION WIRING: menu navigation must remain independent of database/loading code. */
(function(){
  function navigate(page){
    document.querySelectorAll(".nav-button[data-page]").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-page")===page);
    });
    document.querySelectorAll(".page-section[data-page]").forEach(function(section){
      section.classList.toggle("page-hidden", section.getAttribute("data-page")!==page);
    });
    try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }
  }
  document.addEventListener("click",function(event){
    var button=event.target && event.target.closest ? event.target.closest(".nav-button[data-page]") : null;
    if(!button) return;
    var page=button.getAttribute("data-page");
    if(!page) return;
    event.preventDefault();
    event.stopPropagation();
    navigate(page);
  },true);
  window.__badmintonNavigate=navigate;
})();

"use strict";
const STORAGE_KEY="badminton-gui-master-v3";
let state={monthlyFee:1000,reviewMonth:"",members:[],transactions:[],adjustments:[],importedFileName:""};let groupMembersExpanded=false;let editingMemberId="",editingTransactionId="",pendingPaidRequest=null;let archiveFolderHandle=null,archiveIndex=[],archiveViewActive=false,currentStateBeforeArchiveView=null,archiveExportStart="",archiveExportEnd="";
const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);const today=()=>{let d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};const curMonth=()=>today().slice(0,7);const monthOf=d=>d?String(d).slice(0,7):"";
function addMonths(m,n){if(!m)return"";let[a,b]=m.split("-").map(Number), d=new Date(a,b-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthRange(a,b){let r=[], g=0; while(a&&a<=b&&g++<240){ r.push(a); a=addMonths(a,1)} return r}function money(v){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(Number(v||0))}function fmtMonth(m){if(!m)return"";let[a,b]=m.split("-").map(Number); return new Date(a,b-1,1).toLocaleString("en-US",{month:"short",year:"numeric"})}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function amount(v){return Math.abs(Number(String(v??"").replace(/₹|,/g,"").replace(/[^\d.-]/g,""))||0)}function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"")}function clean(v){return String(v||"").replace(/\((adv|paid)[^)]*\)/gi,"").replace(/\s+/g," ").trim()}function normDate(v){if(!v)return"";if(v instanceof Date&&!isNaN(v))return new Date(v-v.getTimezoneOffset()*60000).toISOString().slice(0,10);if(typeof v==="number"&&window.XLSX){let p=XLSX.SSF.parse_date_code(v);if(p)return `${p.y}-${String(p.m).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`}let s=String(v).trim();return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:""}
function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.error(e)}}function loadLocal(){try{let x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(x)state={...state,...x}}catch(e){};for(let k of["members","transactions","adjustments"])if(!Array.isArray(state[k]))state[k]=[];state.transactions=state.transactions.map((t,i)=>({...t,id:t.id||uid(),order:Number(t.order||i+1),feeMonth:t.feeMonth||t.applicableMonth||"",paymentGroupId:t.paymentGroupId||"",bulkOperationId:t.bulkOperationId||"",affectsBalance:t.affectsBalance!==false}))}
const member=id=>state.members.find(x=>x.id===id);const active=()=>state.members.filter(x=>x.active&&!x.deleted);const feeCat=c=>["Monthly Fee","Advance Fee","Arrears Payment"].includes(c);function manualAmt(id,m){return state.adjustments.filter(x=>x.memberId===id&&x.month===m).reduce((s,x)=>s+Number(x.amount||0),0)}
function ledger(mem){let start=monthOf(mem.joiningDate),review=state.reviewMonth||curMonth(),end=addMonths(review,24);if(!start)return{months:{},unallocated:0};let keys=monthRange(start,end),months={};keys.forEach(m=>months[m]={required:Number(state.monthlyFee||0),direct:0,arrears:0,advance:0,manual:manualAmt(mem.id,m),applied:0,pending:0});let refresh=m=>{let x=months[m];x.applied=Math.min(x.required,x.direct+x.arrears+x.advance+x.manual);x.pending=Math.max(x.required-x.applied,0)};keys.forEach(refresh);let apply=(m,a,src)=>{if(!months[m]||a<=0)return a;refresh(m);let u=Math.min(months[m].pending,a);months[m][src]+=u;refresh(m);return a-u};let excess=0;state.transactions.filter(t=>t.memberId===mem.id&&t.direction==="Income"&&feeCat(t.category)).sort((a,b)=>a.order-b.order).forEach(t=>{let src=t.category==="Arrears Payment"?"arrears":t.category==="Advance Fee"?"advance":"direct",m=t.feeMonth||monthOf(t.date)||review;excess+=apply(m,Number(t.amount||0),src)});for(let m of keys){if(excess<=0||m>review)break;excess=apply(m,excess,"arrears")}for(let m of keys){if(excess<=0)break;if(m>review)excess=apply(m,excess,"advance")}return{months,unallocated:excess}}
function monthData(mem,m){return ledger(mem).months[m]||{required:0,direct:0,arrears:0,advance:0,manual:0,applied:0,pending:0}}function transactions(){let bal=0;return[...state.transactions].sort((a,b)=>a.order-b.order).map(t=>{if(t.affectsBalance!==false)bal+=t.direction==="Expense"?-Number(t.amount):Number(t.amount);return{...t,calculatedBalance:bal}})}function summary(){let ts=transactions(),inc=ts.filter(t=>t.direction==="Income"&&t.affectsBalance!==false).reduce((s,t)=>s+Number(t.amount),0),exp=ts.filter(t=>t.direction==="Expense"&&t.affectsBalance!==false).reduce((s,t)=>s+Number(t.amount),0),pending=active().reduce((s,m)=>s+monthData(m,state.reviewMonth||curMonth()).pending,0);return{inc,exp,bal:inc-exp,pending,count:active().length}}
function render(){state.reviewMonth=state.reviewMonth||curMonth();$("monthlyFee").value=state.monthlyFee;$("reviewMonth").value=state.reviewMonth;let s=summary();$("totalIncome").textContent=money(s.inc);$("totalExpenses").textContent=money(s.exp);$("cashBalance").textContent=money(s.bal);$("pendingTotal").textContent=money(s.pending);$("activeMemberCount").textContent=s.count;renderSelectors();renderCards();renderRemoved();renderMonths();renderRecords();renderFeeStatus();renderGroupShowcase();updateConnection()}
function renderGroupShowcase(){const grid=$("groupNameGrid"),count=$("groupMemberCount"),toggle=$("toggleGroupMembersButton");if(!grid||!count||!toggle)return;const members=active().sort((a,b)=>a.name.localeCompare(b.name));count.textContent=`${members.length} Active Member${members.length===1?"":"s"}`;const visible=groupMembersExpanded?members:members.slice(0,8);grid.innerHTML=visible.length?visible.map(m=>`<div class="group-name-chip">${esc(m.name)}</div>`).join(""):'<div class="group-empty">No active members are available.</div>';toggle.classList.toggle("hidden",members.length<=8);toggle.textContent=groupMembersExpanded?"Show Less":"Show All Members"}
function renderSelectors(){let sel=[...$("memberSelector").selectedOptions].map(o=>o.value),a=active().sort((x,y)=>x.name.localeCompare(y.name)),tm=$("transactionMember").value;$("memberSelector").innerHTML=a.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");[...$("memberSelector").options].forEach(o=>o.selected=sel.includes(o.value));$("transactionMember").innerHTML='<option value="">Select member</option>'+a.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");if(a.some(m=>m.id===tm))$("transactionMember").value=tm;renderMemberPicker();let r=state.members.filter(m=>!m.active||m.deleted);$("removedMemberSelector").innerHTML='<option value="">Select member</option>'+r.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.deleted?"Deleted":"Inactive"})</option>`).join("")}
function selectedMemberIds(){return[...$("memberSelector").selectedOptions].map(o=>o.value)}
function updateMemberSelectionSummary(){const ids=selectedMemberIds(),summary=$("memberSelectionSummary"),count=$("selectedDetailsCount");if(summary)summary.textContent=ids.length?`${ids.length} member${ids.length===1?"":"s"} selected`:"Select one or more members to view details";if(count)count.textContent=`${ids.length} selected`}
function renderMemberPicker(){const grid=$("memberChoiceGrid"),search=$("memberSearchInput");if(!grid)return;const query=(search?.value||"").trim().toLowerCase(),selected=new Set(selectedMemberIds()),members=active().sort((a,b)=>a.name.localeCompare(b.name)).filter(m=>m.name.toLowerCase().includes(query));grid.innerHTML=members.length?members.map(m=>`<button type="button" class="member-choice ${selected.has(m.id)?"selected":""}" data-member-id="${m.id}" aria-pressed="${selected.has(m.id)}">${esc(m.name)}</button>`).join(""):'<div class="member-choice-empty">No active members match the search.</div>';grid.querySelectorAll(".member-choice").forEach(button=>button.addEventListener("click",()=>{const option=[...$("memberSelector").options].find(o=>o.value===button.dataset.memberId);if(option)option.selected=!option.selected;renderMemberPicker();renderCards()}));updateMemberSelectionSummary()}
function renderCards(){let ids=[...$("memberSelector").selectedOptions].map(o=>o.value),review=state.reviewMonth||curMonth();$("memberCards").innerHTML=ids.map(id=>{let m=member(id),d=monthData(m,review),css=d.pending===0?"paid":d.applied>0?"partial":"";let shownMonths=archiveViewActive?[...new Set([...state.transactions.map(t=>t.feeMonth),...state.adjustments.map(a=>a.month)].filter(Boolean))].sort():[-2,-1,0,1,2].map(n=>addMonths(review,n));let rows=shownMonths.map(mo=>{let x=monthData(m,mo);return`<div class="month"><strong>${fmtMonth(mo)}</strong><span>Paid ${money(x.applied)} · Pending ${money(x.pending)}</span>${x.pending>0?`<button type="button" onclick="openPaid('${m.id}','${mo}',${x.pending})">Set Paid</button>`:""}</div>`}).join("");return`<article class="member ${css}"><h3>${esc(m.name)}</h3><p>Joining: ${esc(m.joiningDate)}</p><p>Current paid ${money(d.applied)} · pending ${money(d.pending)}</p><div class="months">${rows}</div><div class="actions"><button onclick="editMember('${m.id}')">Edit</button><button onclick="deactivateMember('${m.id}')">Deactivate</button><button class="danger" onclick="deleteMember('${m.id}')">Delete</button></div></article>`}).join("")}
function renderRemoved(){let m=member($("removedMemberSelector").value),c=$("removedMemberDetails");if(!m){c.classList.add("hidden");return}c.classList.remove("hidden");c.innerHTML=`<h3>${esc(m.name)}</h3><p>${m.deleted?"Deleted":"Inactive"}</p><div class="removed-member-actions"><button onclick="restoreMember('${m.id}')">Restore</button>${m.deleted?`<button class="permanent-delete-button" onclick="permanentlyDeleteMember('${m.id}')">Delete Permanently</button>`:""}</div>`}
function renderMonths(){let old=$("financialMonth").value,ms=[...new Set([...state.transactions.map(t=>t.feeMonth||monthOf(t.date)),...state.adjustments.map(a=>a.month)].filter(Boolean))].sort().reverse();$("financialMonth").innerHTML='<option value="">All Months</option>'+ms.map(m=>`<option value="${m}">${fmtMonth(m)}</option>`).join("");if(ms.includes(old))$("financialMonth").value=old}
function getAllocationLabel(record){if(record.isAdjustment)return record.bulkOperationId?"Bulk status-only":"Status only";if(record.allocationMode==="bulk"||record.source==="Bulk Clear Pending")return"Bulk payment";if(record.paymentGroupId){let count=state.transactions.filter(t=>t.paymentGroupId===record.paymentGroupId).length;if(count>1)return`Split payment (${count})`}if(record.allocationMode==="automatic")return"Auto allocated";return"Single entry"}
function feeStatusSource(memberId,month,data){let parts=[];if(data.direct>0)parts.push("Direct payment");if(data.arrears>0)parts.push("Arrears");if(data.advance>0)parts.push("Advance");if(data.manual>0){let isBulk=state.adjustments.some(a=>a.memberId===memberId&&a.month===month&&a.bulkOperationId);parts.push(isBulk?"Bulk status-only":"Status-only adjustment")}return parts.length?parts.join(", "):"No payment recorded"}
function renderFeeStatus(){const month=$("feeStatusMonth")?.value||state.reviewMonth||curMonth(),filter=$("feeStatusFilter")?.value||"All",body=$("feeStatusTableBody");if(!body)return;if(!$("feeStatusMonth").value)$("feeStatusMonth").value=month;let rows=active().sort((a,b)=>a.name.localeCompare(b.name)).map(m=>{let d=monthData(m,month),status=d.pending===0?(d.advance>0?"Advance":"Paid"):d.applied>0?"Partial":"Pending";return{m,d,status,source:feeStatusSource(m.id,month,d)}}).filter(x=>filter==="All"||x.status===filter);body.innerHTML=rows.map(x=>`<tr><td><strong>${esc(x.m.name)}</strong></td><td>${money(x.d.required)}</td><td>${money(x.d.direct)}</td><td>${money(x.d.arrears)}</td><td>${money(x.d.advance)}</td><td>${money(x.d.manual)}</td><td>${money(x.d.applied)}</td><td>${money(x.d.pending)}</td><td><span class="status-pill status-${x.status.toLowerCase()}">${x.status}</span></td><td class="source-list">${esc(x.source)}</td></tr>`).join("")||'<tr><td colspan="10">No members match this status filter.</td></tr>'}
function renderRecords(){let v=$("financialView").value,mo=$("financialMonth").value,w=$("financialTableWrapper");if(!v){w.classList.add("hidden");return}w.classList.remove("hidden");let rows=v==="Adjustments"?state.adjustments.filter(a=>!mo||a.month===mo).map(a=>({...a,feeMonth:a.month,direction:"Status",category:"Manual Adjustment",description:a.note,calculatedBalance:"",isAdjustment:true})):transactions().filter(t=>(v==="All"||t.direction===v)&&(!mo||(t.feeMonth||monthOf(t.date))===mo));$("financialTableBody").innerHTML=rows.map(r=>{let m=member(r.memberId);return`<tr><td>${esc(r.date)}</td><td>${esc(r.feeMonth||"")}</td><td>${esc(m?m.name:r.name||"General")}</td><td>${esc(r.direction)}</td><td>${esc(r.category)}</td><td>${esc(r.description||"")}</td><td>${money(r.amount)}</td><td>${r.calculatedBalance===""?"":money(r.calculatedBalance)}</td><td>${esc(getAllocationLabel(r))}</td><td>${r.isAdjustment?`<button onclick="deleteAdjustment('${r.id}')">Delete</button>`:`<button onclick="editTransaction('${r.id}')">Edit</button> <button onclick="deleteTransaction('${r.id}')">Delete</button>`}</td></tr>`}).join("")||'<tr><td colspan="10">No records</td></tr>'}
function resetMember(){editingMemberId="";$("memberForm").reset();$("joiningDate").value=today();$("memberState").value="active";$("memberFormTitle").textContent="Add Member";$("saveMemberButton").textContent="Add Member";$("cancelMemberButton").classList.add("hidden")}
function requiresMonth(dir,cat){return dir==="Expense"&&cat==="Court Fee"||dir==="Income"&&(feeCat(cat)||cat==="Court Fee Contribution")}function category(){return $("transactionDirection").value==="Income"?$("incomeCategory").value:$("expenseCategory").value}function description(){return $("transactionDescriptionChoice").value==="Other / Custom"?$("transactionDescription").value.trim():$("transactionDescriptionChoice").value}
function updateFields(){let dir=$("transactionDirection").value,cat=category(),mem=dir==="Income"&&feeCat(cat),req=requiresMonth(dir,cat);$("incomeCategoryContainer").classList.toggle("hidden",dir!=="Income");$("expenseCategoryContainer").classList.toggle("hidden",dir!=="Expense");$("transactionMemberContainer").classList.toggle("hidden",!mem);$("allocationMethodContainer").classList.toggle("hidden",!mem);$("feeMonthContainer").classList.toggle("hidden",!req);$("transactionNameContainer").classList.toggle("hidden",mem);$("transactionNameLabel").textContent=dir==="Expense"?"Paid To (optional)":"Received From (optional)";$("feeMonthLabel").textContent=dir==="Expense"&&cat==="Court Fee"?"Court Fee Applicable Month":"Applicable Month";$("feeMonthHelp").textContent=mem?"Automatic mode clears oldest pending first.":"Select the month this transaction applies to.";if(req&&!$("feeMonth").value)$("feeMonth").value=state.reviewMonth||curMonth();preview()}
function defaultDesc(){let c=category(),d=$("transactionDirection").value==="Income"?({"Monthly Fee":"Monthly Fee Payment","Advance Fee":"Advance Payment","Arrears Payment":"Arrears Payment","Opening Balance":"Opening Balance","Interest":"Interest Received","Court Fee Contribution":"Contribution","Shuttle Reimbursement":"Reimbursement","Other Income":"Other / Custom"}[c]||"Contribution"):({"Court Fee":"Court Booking Payment","Shuttle Purchase":"Shuttle Purchase","Equipment":"Equipment Purchase","Member Reimbursement":"Reimbursement","Other Expense":"Other / Custom"}[c]||"Payment");$("transactionDescriptionChoice").value=d;toggleCustom()}
function toggleCustom(){$("customDescriptionContainer").classList.toggle("hidden",$("transactionDescriptionChoice").value!=="Other / Custom")}
function resetTransaction(){editingTransactionId="";$("transactionForm").reset();$("transactionDate").value=today();$("transactionDirection").value="Income";$("incomeCategory").value="Monthly Fee";$("allocationMethod").value="automatic";$("feeMonth").value=state.reviewMonth||curMonth();$("transactionDescriptionChoice").value="Monthly Fee Payment";$("transactionFormTitle").textContent="Add Transaction";$("saveTransactionButton").textContent="Add Transaction";$("cancelTransactionButton").classList.add("hidden");$("allocationPreview").classList.add("hidden");toggleCustom();updateFields()}
function allocate(mem,pay,target){let l=ledger(mem),left=pay,out=[],monthly=Number(state.monthlyFee);for(let mo of monthRange(monthOf(mem.joiningDate),target)){if(left<=0)break;let p=(l.months[mo]||{pending:monthly}).pending;if(p>0){let a=Math.min(p,left);out.push({month:mo,amount:a,category:mo<target?"Arrears Payment":"Monthly Fee",type:mo<target?"Oldest pending":"Current month"});left-=a}}let mo=addMonths(target,1),g=0;while(left>0&&g++<120){let p=(l.months[mo]||{pending:monthly}).pending;if(p>0){let a=Math.min(p,left);out.push({month:mo,amount:a,category:"Advance Fee",type:a<monthly?"Partial advance":"Future advance"});left-=a}mo=addMonths(mo,1)}return out}
function preview(){let box=$("allocationPreview");box.classList.add("hidden");if(editingTransactionId||$("transactionDirection").value!=="Income"||!feeCat(category()))return;let m=member($("transactionMember").value),a=amount($("transactionAmount").value),mo=$("feeMonth").value;if(!m||!a||!mo)return;let arr=$("allocationMethod").value==="automatic"?allocate(m,a,mo):[{month:mo,amount:a,category:category(),type:"Manual selection"}];box.classList.remove("hidden");$("allocationPreviewMessage").textContent=`${money(a)} will be saved as ${arr.length} month-level record(s).`;$("allocationPreviewList").innerHTML=arr.map(x=>`<div class="preview-row"><strong>${fmtMonth(x.month)}</strong><span>${money(x.amount)}</span><span>${esc(x.type)}</span></div>`).join("")}
window.editMember=id=>{let m=member(id);editingMemberId=id;$("memberName").value=m.name;$("joiningDate").value=m.joiningDate;$("memberState").value=m.active?"active":"inactive";$("memberFormTitle").textContent="Edit Member";$("saveMemberButton").textContent="Update Member";$("cancelMemberButton").classList.remove("hidden")};window.deactivateMember=id=>{let m=member(id);m.active=false;m.deleted=false;commit("Member deactivated")};window.deleteMember=id=>{if(confirm("Move member to Deleted Members?")){let m=member(id);m.active=false;m.deleted=true;commit("Member deleted")}};window.restoreMember=id=>{let m=member(id);m.active=true;m.deleted=false;commit("Member restored")};window.permanentlyDeleteMember=id=>{const m=member(id);if(!m||!m.deleted)return;const linkedTransactions=state.transactions.filter(t=>t.memberId===id),linkedAdjustments=state.adjustments.filter(a=>a.memberId===id);if(linkedTransactions.length||linkedAdjustments.length){alert(`Permanent deletion is blocked because ${m.name} still has linked financial history.\n\nTransactions: ${linkedTransactions.length}\nStatus adjustments: ${linkedAdjustments.length}\n\nKeeping the member record protects balances, audit history, and archive references. The member can remain Deleted or be restored.`);return}if(!confirm(`Permanently delete ${m.name}?\n\nThis member has no linked current-master transactions or adjustments. This action cannot be undone.`))return;state.members=state.members.filter(x=>x.id!==id);$("removedMemberSelector").value="";commit("Member permanently deleted")};window.deleteTransaction=id=>{if(confirm("Delete this transaction?")){state.transactions=state.transactions.filter(t=>t.id!==id);commit("Transaction deleted")}};window.deleteAdjustment=id=>{state.adjustments=state.adjustments.filter(a=>a.id!==id);commit("Adjustment deleted")};
window.editTransaction=id=>{let t=state.transactions.find(x=>x.id===id);editingTransactionId=id;$("transactionDate").value=t.date;$("transactionDirection").value=t.direction;if(t.direction==="Income")$("incomeCategory").value=t.category;else $("expenseCategory").value=t.category;$("transactionMember").value=t.memberId||"";$("feeMonth").value=t.feeMonth||"";$("transactionName").value=t.name||"";$("transactionAmount").value=t.amount;let opts=[...$("transactionDescriptionChoice").options].map(o=>o.value);if(opts.includes(t.description))$("transactionDescriptionChoice").value=t.description;else{$("transactionDescriptionChoice").value="Other / Custom";$("transactionDescription").value=t.description||""}toggleCustom();updateFields();$("transactionFormTitle").textContent="Edit Transaction";$("saveTransactionButton").textContent="Update Transaction";$("cancelTransactionButton").classList.remove("hidden")};
window.openPaid=(id,mo,p)=>{pendingPaidRequest={id,mo};$("setPaidMessage").textContent=`${member(id).name}, ${fmtMonth(mo)}`;$("setPaidDate").value=today();$("setPaidAmount").value=p;$("setPaidModal").classList.remove("hidden")};$("cancelSetPaidButton").onclick=()=>$("setPaidModal").classList.add("hidden");$("confirmSetPaidButton").onclick=()=>{let a=amount($("setPaidAmount").value),m=member(pendingPaidRequest.id),balance=$("setPaidBalanceEffect").value==="yes";if(balance)state.transactions.push({id:uid(),paymentGroupId:uid(),order:nextOrder(),date:$("setPaidDate").value,direction:"Income",category:pendingPaidRequest.mo<(state.reviewMonth||curMonth())?"Arrears Payment":"Monthly Fee",memberId:m.id,feeMonth:pendingPaidRequest.mo,name:"",description:$("setPaidNote").value,amount:a,affectsBalance:true,source:"Set Paid"});else state.adjustments.push({id:uid(),memberId:m.id,month:pendingPaidRequest.mo,date:$("setPaidDate").value,amount:a,note:$("setPaidNote").value,affectsBalance:false});$("setPaidModal").classList.add("hidden");commit("Payment status updated")};function nextOrder(){return state.transactions.reduce((m,t)=>Math.max(m,Number(t.order||0)),0)+1}
$("memberForm").onsubmit=e=>{e.preventDefault();let name=clean($("memberName").value),date=$("joiningDate").value,on=$("memberState").value==="active";if(editingMemberId){let m=member(editingMemberId);Object.assign(m,{name,joiningDate:date,active:on,deleted:on?false:m.deleted})}else state.members.push({id:uid(),name,joiningDate:date,active:on,deleted:false});resetMember();commit("Member saved")};$("cancelMemberButton").onclick=resetMember;
$("saveSettingsButton").onclick=async()=>{
  if(!supabaseReady){
    while(supabaseLoading) await new Promise(r=>setTimeout(r,50));
    if(!supabaseReady){alert("Supabase is not connected. Please wait for the database connection to finish.");return;}
  }
  const fee=amount($("monthlyFee").value), review=$("reviewMonth").value, theme=$("interfaceTheme").value;
  try{
    setSync("saving","Saving settings to Supabase...");
    await writeAppSetting("Monthly Fee",fee);
    await writeAppSetting("Review Month",review);
    await writeAppSetting("Interface Theme",theme);
    const check=await sbFetch("app_settings?select=key,value,updated_at&key=eq."+encodeURIComponent("Monthly Fee")+"&limit=1");
    const row=Array.isArray(check)&&check[0];
    if(!row || String(row.value)!==String(fee)) throw new Error("Supabase read-back did not return the value that was just saved.");
    state.monthlyFee=fee; state.reviewMonth=review; $("feeMonth").value=review; saveLocal(); render();
    setSync("connected","Settings saved to Supabase and verified.");
  }catch(e){
    console.error(e); setSync("error","Settings database save failed: "+e.message);

async function sbFetch(path, options={}) {
  const headers = {
    apikey: SUPABASE_PUBLISHABLE_KEY,
    Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
    Accept: "application/json",
    ...(options.body ? {"Content-Type":"application/json","Prefer":"return=minimal"} : {}),
    ...(options.headers||{})
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {...options, headers});
  if(!res.ok){
    let detail = "";
    try { detail = await res.text(); } catch(e) {}
    throw new Error(`Supabase ${res.status}: ${detail || res.statusText}`);
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadSupabaseState(showToast=true){
  if(supabaseLoading) return;
  supabaseLoading=true;
  try {
    setSync("saving","Loading shared database...");
    const [ms,tx,ad,settings] = await Promise.all([
      sbFetch("members?select=*&order=name.asc"),
      sbFetch("transactions?select=*&order=transaction_order.asc"),
      sbFetch("manual_adjustments?select=*&order=adjustment_date.asc"),
      sbFetch("app_settings?select=key,value,updated_at&order=updated_at.desc")
    ]);
    const ids=new Set((ms||[]).map(x=>String(x.id)));
    const getSetting=k=>{const x=(settings||[]).find(r=>String(r.key).toLowerCase()===k.toLowerCase()); return x?.value??""};
    state={
      monthlyFee:amount(getSetting("Monthly Fee"))||1000,
      reviewMonth:String(getSetting("Review Month")||curMonth()).slice(0,7),
      members:(ms||[]).map(fromDbMember).filter(m=>m.id&&m.name),
      transactions:(tx||[]).map(fromDbTransaction).filter(t=>t.amount>0&&["Income","Expense"].includes(t.direction)&&(!t.memberId||ids.has(t.memberId))),
      adjustments:(ad||[]).map(fromDbAdjustment).filter(a=>a.memberId&&ids.has(a.memberId)&&a.month&&a.amount),
      importedFileName:String(getSetting("Imported File")||"Supabase")
    };
    supabaseSnapshot={members:new Set((ms||[]).map(x=>String(x.id))),transactions:new Set((tx||[]).map(x=>String(x.id))),adjustments:new Set((ad||[]).map(x=>String(x.id)))};
    supabaseReady=true;
    saveLocal();

    document.body.classList.remove("app-locked"); document.body.classList.add("app-unlocked");
    const gate=$("masterGate"); if(gate)gate.classList.add("hidden");
    setSync("connected","Supabase connected — shared data loaded.");
    $("applicationStatus").textContent="Shared database connected.";

async function writeAppSetting(key,value){
  const encoded=encodeURIComponent(key);
  const existing=await sbFetch(`app_settings?select=key&key=eq.${encoded}&limit=1`);
  const row={key:String(key),value:String(value)};
  if(Array.isArray(existing) && existing.length){
    await sbFetch(`app_settings?key=eq.${encoded}`,{method:"PATCH",body:JSON.stringify({value:String(value),updated_at:new Date().toISOString()})});
  }else{
    await sbFetch("app_settings",{method:"POST",body:JSON.stringify({...row,updated_at:new Date().toISOString()})});
  }
}

async function syncSupabaseState(){
  if(!supabaseReady || supabaseSaving) return;
  supabaseSaving=true;
  try {
    setSync("saving","Saving changes to shared database...");
    const currentMemberIds=new Set(state.members.map(x=>String(x.id)));
    await Promise.all(state.members.map(m=>{
      const id=encodeURIComponent(String(m.id));
      const row=dbMember(m);
      return supabaseSnapshot.members.has(String(m.id))
        ? sbFetch(`members?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(row)})
        : sbFetch("members",{method:"POST",body:JSON.stringify(row)});
    }));
    await Promise.all(state.transactions.map(t=>{
      const id=encodeURIComponent(String(t.id));
      const row=dbTransaction(t);
      return supabaseSnapshot.transactions.has(String(t.id))
        ? sbFetch(`transactions?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(row)})
        : sbFetch("transactions",{method:"POST",body:JSON.stringify(row)});
    }));
    await Promise.all(state.adjustments.map(a=>{
      const id=encodeURIComponent(String(a.id));
      const row=dbAdjustment(a);
      return supabaseSnapshot.adjustments.has(String(a.id))
        ? sbFetch(`manual_adjustments?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(row)})
        : sbFetch("manual_adjustments",{method:"POST",body:JSON.stringify(row)});
    }));
    const del=(table,column,oldSet,newSet)=>{
      const ids=[...oldSet].filter(id=>!newSet.has(id));
      return Promise.all(ids.map(id=>sbFetch(`${table}?${column}=eq.${encodeURIComponent(id)}`,{method:"DELETE"})));
    };
    await del("members","id",supabaseSnapshot.members,new Set(state.members.map(x=>String(x.id))));
    await del("transactions","id",supabaseSnapshot.transactions,new Set(state.transactions.map(x=>String(x.id))));
    await del("manual_adjustments","id",supabaseSnapshot.adjustments,new Set(state.adjustments.map(x=>String(x.id))));
    await writeAppSetting("Monthly Fee",Number(state.monthlyFee||0));
    await writeAppSetting("Review Month",state.reviewMonth||curMonth());
    await writeAppSetting("Imported File",state.importedFileName||"Supabase");
    await writeAppSetting("Default Allocation","Oldest pending, current month, then future advance");
    await writeAppSetting("Bulk Clear Default","Status only, no cash balance change");
    await writeAppSetting("Workbook Version","4");
    await writeAppSetting("Last Updated",new Date().toISOString());
    supabaseSnapshot={members:new Set(state.members.map(x=>String(x.id))),transactions:new Set(state.transactions.map(x=>String(x.id))),adjustments:new Set(state.adjustments.map(x=>String(x.id)))};
    saveLocal();
    setSync("connected","All changes saved to shared database.");
  } catch(e) {
    console.error(e); setSync("error","Database save failed: "+e.message);
    alert("Changes could not be saved to Supabase.\n\n"+e.message);
  } finally { supabaseSaving=false; }
}

  saveLocal(); render(); $("applicationStatus").textContent=msg||"Saved";
  return supabaseReady ? syncSupabaseState() : Promise.resolve();
}

    if (!t) return;

    t.className = 'autosave-toast show ' + (type === 'error' ? 'error' : '');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }
}

// ---- Admin check (robust) ----
async function checkAdminStatus() {
  if (!authSession) return false;
  const userId = authSession.user.id;
  const userEmail = authSession.user.email;
  debugLog('🔍 Checking admin status for user: ' + userId, 'info');

  try {
    const { data: rpcData, error: rpcError } = await supabaseClient.rpc('is_app_admin');
    if (!rpcError && rpcData === true) {
      debugLog('✅ Admin status: true (via RPC)', 'success');
      return true;
    } else if (rpcError) {
      debugLog('⚠️ RPC failed: ' + rpcError.message, 'warn');
    }
  } catch(e) {
    debugLog('⚠️ RPC exception: ' + e.message, 'warn');
  }

  try {
    const { data: queryData, error: queryError } = await supabaseClient
      .from('private.app_admins')
      .select('user_id')
      .eq('user_id', userId)
      .maybeSingle();
    if (!queryError && queryData) {
      debugLog('✅ Admin status: true (via direct query)', 'success');
      return true;
    } else if (queryError) {
      debugLog('⚠️ Direct query failed: ' + queryError.message, 'warn');
    }
  } catch(e) {
    debugLog('⚠️ Direct query exception: ' + e.message, 'warn');
  }

  if (userEmail === 'vigilancekeeper@gmail.com') {
    debugLog('✅ Admin status: true (via email fallback)', 'success');
    return true;
  }

  debugLog('❌ Admin status: false', 'error');
  return false;
}

async function handleLogin(email, password) {
  try {
    debugLog('🔑 Attempting login for: ' + email, 'info');
    const errorEl = document.getElementById('loginError') || document.getElementById('loginOverlayError');
    if (errorEl) errorEl.textContent = '';
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    debugLog('✅ Login successful!', 'success');
    if (errorEl) errorEl.textContent = '';
    const modal = document.getElementById('loginModal');
    if (modal) modal.classList.add('hidden');
    hideLoginOverlay();
    await refreshAuth();
    await loadSupabaseState(true);
    // After data loads, show toast
    showToast('✅ Logged in as ' + (isAdmin ? 'Admin' : 'Reader'), 'success');
  } catch(e) {
    debugLog('❌ Login failed: ' + e.message, 'error');
    const errorEl = document.getElementById('loginError') || document.getElementById('loginOverlayError');
    if (errorEl) errorEl.textContent = '❌ ' + (e.message || 'Login failed');
    console.error('Login error:', e);
  }
}

async function handleLogout() {
  try {
    debugLog('🚪 Logging out...', 'info');
    await supabaseClient.auth.signOut();
    authSession = null; isAdmin = false;
    updateAuthUI();
    showToast('Logged out', '');
    // Show login overlay and hide dashboard
    showLoginOverlay();
    document.querySelector('.wrap')?.classList.add('hidden');
    // Clear the dashboard data visually (optional – render empty)
    // We can just let the overlay hide everything.
    debugLog('✅ Logged out.', 'success');
  } catch(e) {
    debugLog('❌ Logout failed: ' + e.message, 'error');
    console.error('Logout error:', e);
    showToast('Logout failed', 'error');
  }
}

async function refreshAuth() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    authSession = session;
    if (session) {
      debugLog('👤 Session found for: ' + session.user.email, 'success');
      isAdmin = await checkAdminStatus();
    } else {
      debugLog('👤 No session found.', 'info');
      isAdmin = false;
    }
    updateAuthUI();
    return { session, isAdmin };
  } catch(e) {
    debugLog('❌ Auth refresh failed: ' + e.message, 'error');
    return { session: null, isAdmin: false };
  }
}

// ---- Override commit and sbFetch for auth ----
window.commit = function(msg) {
  if (archiveViewActive) { alert('Archive view is read only.'); return Promise.resolve(); }
  if (!isAdmin) { alert('Please login as admin to save changes.'); return Promise.resolve(); }
  saveLocal(); render(); $("applicationStatus").textContent = msg || "Saved";
  return supabaseReady ? syncSupabaseState() : Promise.resolve();
};

window.sbFetch = async function(path, options={}) {
  let token = AUTH_SUPABASE_ANON_KEY;
  if (authSession && authSession.access_token) token = authSession.access_token;
  const headers = {
    apikey: AUTH_SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token}`,
    Accept: "application/json",
    ...(options.body ? {"Content-Type":"application/json","Prefer":"return=minimal"} : {}),
    ...(options.headers||{})
  };
  debugLog('📡 Fetching: ' + path, 'info');
  try {
    const res = await fetch(`${AUTH_SUPABASE_URL}/rest/v1/${path}`, {...options, headers});
    debugLog('📡 Status: ' + res.status + ' for ' + path, res.ok ? 'success' : 'error');
    if(!res.ok){
      let detail = "";
      try { detail = await res.text(); } catch(e) {}
      debugLog('❌ Error response: ' + detail, 'error');
      throw new Error(`Supabase ${res.status}: ${detail || res.statusText}`);
    }
    if(res.status===204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    debugLog('❌ Fetch exception: ' + e.message, 'error');
    throw e;
  }
};
